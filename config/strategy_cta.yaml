# Perfil del CTA Swing D1 (F4, D-077 -> F5, D-078): la estrategia convalidada en F2
# (D-073/D-074) con su magic, sus símbolos y su motor. Un fichero aparte de strategy.yaml
# porque es OTRA estrategia con OTRA cadencia (D1, no M15) y OTRA vida: aquí se decide qué
# evalúa el modo alerta, no qué hace la ejecución.
#
# El servicio (api/services/cta_alert_service.py) es el único consumidor. Si el fichero
# no existe, el perfil sale vacío y el servicio queda deshabilitado CON MOTIVO; si está
# mal formado, settings/strategy_cta_source.py lanza StrategyConfigError (un default
# silencioso aquí encendería una estrategia que nadie configuró).
#
# Los parámetros del engine son los clásicos fijados en F2 SIN recalibrar (D-073):
# ATR 14 (Wilder), Donchian 20, chandelier k=3.0.
#
# auto_execute (F5): la OTRA mitad del interruptor del servicio. `estado().auto_execute`
# solo es `true` si este YAML lo pide, el perfil está habilitado Y `Runtime.cta_service()`
# cableó un puerto de ejecución (ExecutionService). Con `false` (el estado por defecto de
# un sistema que aún no se convalidó en vivo) el CTA sigue en modo alerta: evalúa, escribe
# su fila en setup_log y NO manda órdenes. Encenderlo efectivamente requiere puerto y
# terminal; el vol-target del sizing lo aporta la ejecución al ejecutar.

enabled: true
magic: 8882027
comment: "Trinity CTA D1"
timeframe: D1
bars: 120
symbols:
  - EURUSD
  - XAUUSD
  - US500
  - GBPUSD
  - AUDUSD
auto_execute: false
engine:
  atr_n: 14
  don_n: 20
  mult: 3.0
