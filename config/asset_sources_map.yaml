# ===================================
# asset_sources_map.yaml
# Mapeo dinámico de fuentes por activo/mercado
# Orquesta qué adaptadores y servicios macro/blandos se activan por símbolo
# ===================================

# ================================
# MERCADO BRASIL (B3) - FUTUROS
# ================================
WDO_FUTURES:
  market_type: "B3_FUTURES"
  exchange: "B3"
  symbol: "WDO"
  timeframe: "M15"
  # Ventanas/liquidez: config/trading_hours.json -> sessions.b3_mini_usd
  session_id: "b3_mini_usd"
  data_adapter: "mt5_b3"  # mt5_b3 | nelogica_profit | cedro_technologies
  lot_calculator: "b3_mini_contracts"
  soft_data_sources:
    - bcb_focus           # Boletim Focus (IPCA/SELIC)
    - foreigner_flow      # Flujo de capital extranjero B3
    - di_futures_yield    # Curva de tasas DI1
    - news_blackout       # Copom / Eventos fiscales
  technical_engines:
    - smc_engine
    - orderflow_engine

